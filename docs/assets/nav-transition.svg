<svg xmlns="http://www.w3.org/2000/svg" width="720" height="300" viewBox="0 0 720 300" role="img" aria-label="Sona navigation transition animation">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#140D26"/>
      <stop offset="60%" stop-color="#241044"/>
      <stop offset="100%" stop-color="#0F0A1E"/>
    </linearGradient>
    <linearGradient id="screenA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3B1D6E"/>
      <stop offset="100%" stop-color="#1E1238"/>
    </linearGradient>
    <linearGradient id="screenB" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F766E"/>
      <stop offset="100%" stop-color="#16283F"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="50%" stop-color="#D946EF"/>
      <stop offset="100%" stop-color="#2DD4BF"/>
    </linearGradient>
  </defs>

  <rect width="720" height="300" rx="26" fill="url(#bg)"/>
  <circle cx="80" cy="40" r="140" fill="#8B5CF6" opacity="0.10"/>
  <circle cx="660" cy="270" r="150" fill="#2DD4BF" opacity="0.07"/>

  <text x="36" y="48" fill="#F5F3FF" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="22" font-weight="700">Navigation transition</text>
  <text x="36" y="70" fill="#A78BFA" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="11" letter-spacing="2.5">FADE + 1/14 SLIDE · 260 ms IN · 180 ms OUT</text>

  <!-- outgoing screen -->
  <g transform="translate(84,104)">
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0;-38 0;-38 0;0 0" keyTimes="0;0.22;0.78;1" dur="3.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0;0;1" keyTimes="0;0.22;0.78;1" dur="3.4s" repeatCount="indefinite"/>
      <rect width="210" height="150" rx="18" fill="url(#screenA)" stroke="#8B5CF6" stroke-opacity="0.35"/>
      <rect x="18" y="18" width="64" height="9" rx="4.5" fill="#C4B5FD" opacity="0.85"/>
      <rect x="18" y="42" width="174" height="46" rx="12" fill="#8B5CF6" opacity="0.28"/>
      <circle cx="41" cy="65" r="14" fill="#D946EF" opacity="0.75"/>
      <rect x="64" y="56" width="88" height="7" rx="3.5" fill="#EDE9FE" opacity="0.75"/>
      <rect x="64" y="70" width="58" height="6" rx="3" fill="#C4B5FD" opacity="0.5"/>
      <rect x="18" y="100" width="174" height="8" rx="4" fill="#A78BFA" opacity="0.3"/>
      <rect x="18" y="118" width="132" height="8" rx="4" fill="#A78BFA" opacity="0.22"/>
      <text x="105" y="142" fill="#C4B5FD" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="9" text-anchor="middle" letter-spacing="1.5">HOME · EXIT</text>
    </g>
  </g>

  <!-- incoming screen -->
  <g transform="translate(426,104)">
    <g>
      <animateTransform attributeName="transform" type="translate" values="64 0;0 0;0 0;64 0" keyTimes="0;0.22;0.78;1" dur="3.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.22;0.78;1" dur="3.4s" repeatCount="indefinite"/>
      <rect width="210" height="150" rx="18" fill="url(#screenB)" stroke="#2DD4BF" stroke-opacity="0.35"/>
      <rect x="18" y="18" width="64" height="9" rx="4.5" fill="#99F6E4" opacity="0.9"/>
      <rect x="18" y="42" width="174" height="46" rx="12" fill="#14B8A6" opacity="0.22"/>
      <circle cx="41" cy="65" r="14" fill="#2DD4BF" opacity="0.8"/>
      <rect x="64" y="56" width="88" height="7" rx="3.5" fill="#F0FDFA" opacity="0.8"/>
      <rect x="64" y="70" width="58" height="6" rx="3" fill="#99F6E4" opacity="0.5"/>
      <rect x="18" y="100" width="174" height="8" rx="4" fill="#5EEAD4" opacity="0.3"/>
      <rect x="18" y="118" width="132" height="8" rx="4" fill="#5EEAD4" opacity="0.22"/>
      <text x="105" y="142" fill="#99F6E4" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="9" text-anchor="middle" letter-spacing="1.5">DETAIL · ENTER</text>
    </g>
  </g>

  <!-- arrow -->
  <g transform="translate(330,170)">
    <rect width="60" height="3" rx="1.5" fill="url(#accent)"/>
    <path d="M52 -6 L62 1.5 L52 9" fill="none" stroke="#2DD4BF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <text x="360" y="278" fill="#8B7BB8" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="11" text-anchor="middle">enterTransition = fadeIn(260) + slideInHorizontally(260) { it / 14 }</text>
</svg>
