name: CI/CD

on:
  push:
    branches: [master, main, develop]
    tags: ["v*"]
  pull_request:
    branches: [master, main, develop]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.daemon=false"
  ANDROID_COMPILE_SDK: "37"

jobs:
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # ТЕСТЫ
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  test:
    name: 🧪 Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-$HOME/Android/Sdk}}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          if ! command -v sdkmanager >/dev/null 2>&1; then
            for dir in "$SDK_ROOT/cmdline-tools/latest/bin" "$SDK_ROOT/cmdline-tools/bin" "$SDK_ROOT/tools/bin"; do
              if [ -x "$dir/sdkmanager" ]; then
                export PATH="$dir:$PATH"
                echo "$dir" >> "$GITHUB_PATH"
                break
              fi
            done
          fi
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-${ANDROID_COMPILE_SDK}" >/dev/null 2>&1 || true
          sdkmanager "build-tools;${ANDROID_COMPILE_SDK}.0.0" >/dev/null 2>&1 || true
          sdkmanager "platform-tools" >/dev/null 2>&1 || true

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --console=plain

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            **/build/reports/tests
            **/build/test-results/testDebugUnitTest
          if-no-files-found: ignore

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # СБОРКА DEBUG APK (для PR и develop)
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  build-debug:
    name: 🔨 Build Debug APK
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Ruby + Fastlane
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Set up Android SDK
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-$HOME/Android/Sdk}}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          yes | sdkmanager --licenses >/dev/null 2>&1 || true

      - name: Build debug APK
        run: ./gradlew assembleDebug --console=plain

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: sona-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # СБОРКА RELEASE APK (только для master/main и тегов)
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  build-release:
    name: 🚀 Build Release APK
    needs: test
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-$HOME/Android/Sdk}}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          yes | sdkmanager --licenses >/dev/null 2>&1 || true

      - name: Build release APK
        run: ./gradlew assembleRelease --console=plain

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: sona-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # ОТПРАВКА DEBUG APK В TELEГРАМ (PR, develop, master)
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  telegram-debug:
    name: 📨 Send Debug to Telegram
    needs: build-debug
    if: always() && needs.build-debug.result == 'success' && github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Ruby + Fastlane
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Download debug APK
        uses: actions/download-artifact@v4
        with:
          name: sona-debug-apk
          path: dist

      - name: Prepare caption
        id: caption
        run: |
          BRANCH="${GITHUB_REF_NAME}"
          AUTHOR="${{ github.actor }}"
          COMMIT="${{ github.sha }}"
          SHORT_COMMIT="${COMMIT:0:7}"
          COMMIT_MSG=$(git log -1 --pretty=%s 2>/dev/null || echo "Build from $BRANCH")
          
          # Формируем красивый caption
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            PR_NUM="${{ github.event.number }}"
            CAPTION="🔨 *DEBUG BUILD (PR #${PR_NUM})*
          
          📦 Branch: \`${BRANCH}\`
          👤 Author: ${AUTHOR}
          📝 ${COMMIT_MSG}
          🔗 Commit: \`${SHORT_COMMIT}\`
          
          _Готово к ревью_"
          else
            CAPTION="🔨 *DEBUG BUILD*
          
          📦 Branch: \`${BRANCH}\`
          👤 Author: ${AUTHOR}
          📝 ${COMMIT_MSG}
          🔗 Commit: \`${SHORT_COMMIT}\`
          
          _Автосборка после пуша_"
          fi
          
          # Экранируем для YAML
          echo "caption<<EOF" >> "$GITHUB_OUTPUT"
          echo "$CAPTION" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Send to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          APK="$(ls dist/*.apk | head -n 1)"
          CAPTION='${{ steps.caption.outputs.caption }}'
          
          echo "📤 Отправляю: $APK"
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendDocument" \
            -F "chat_id=${TELEGRAM_CHAT_ID}" \
            -F "document=@${APK}" \
            -F "caption=${CAPTION}" \
            -F "parse_mode=Markdown"
          
          echo "✅ Отправлено!"

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # ОТПРАВКА RELEASE APK В TELEГРАМ (master + теги)
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  telegram-release:
    name: 📲 Send Release to Telegram
    needs: build-release
    if: always() && needs.build-release.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Ruby + Fastlane
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Download release APK
        uses: actions/download-artifact@v4
        with:
          name: sona-release-apk
          path: dist

      - name: Prepare caption
        id: caption
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF_NAME}"
            CAPTION="🚀 *RELEASE ${VERSION}*
          
          🎉 Новая версия готова!
          
          📦 Скачать также можно в GitHub Releases"
          else
            BRANCH="${GITHUB_REF_NAME}"
            AUTHOR="${{ github.actor }}"
            COMMIT="${{ github.sha }}"
            SHORT_COMMIT="${COMMIT:0:7}"
            COMMIT_MSG=$(git log -1 --pretty=%s 2>/dev/null || echo "Release from $BRANCH")
          
            CAPTION="🚀 *RELEASE BUILD*
          
          📦 Branch: \`${BRANCH}\`
          👤 Author: ${AUTHOR}
          📝 ${COMMIT_MSG}
          🔗 Commit: \`${SHORT_COMMIT}\`
          
          _Релизная сборка_"
          fi
          
          echo "caption<<EOF" >> "$GITHUB_OUTPUT"
          echo "$CAPTION" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Send to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          APK="$(ls dist/*.apk | head -n 1)"
          CAPTION='${{ steps.caption.outputs.caption }}'
          
          echo "📤 Отправляю: $APK"
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendDocument" \
            -F "chat_id=${TELEGRAM_CHAT_ID}" \
            -F "document=@${APK}" \
            -F "caption=${CAPTION}" \
            -F "parse_mode=Markdown"
          
          echo "✅ Отправлено!"

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # GITHUB RELEASE (только при создании тега v*)
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  github-release:
    name: 📦 Create GitHub Release
    needs: build-release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download release APK
        uses: actions/download-artifact@v4
        with:
          name: sona-release-apk
          path: dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          generate_release_notes: true
          draft: false
          prerelease: false